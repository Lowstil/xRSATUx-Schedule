plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.university.schedule'
    compileSdk 36

    defaultConfig {
        applicationId "com.university.schedule"
        minSdkVersion 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Нужно явно включить начиная с AGP 8 — иначе BuildConfig.DEBUG (используется
    // в ScheduleApplication для условного включения StrictMode) не сгенерируется.
    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt','META-INF/*.kotlin_module','META-INF/INDEX.LIST']
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // ВАЖНО: обе зависимости POI должны быть одной версии (5.2.5).
    // poi-ooxml 5.5.1 тянет org.apache.poi.poifs.nio.CleanerUtil, использующий
    // MethodHandle.invoke/invokeExact (инструкция invoke-polymorphic) — это
    // аппаратная фича ART, которую D8 умеет дексить только начиная с API 26,
    // и никакое core library desugaring этого не обходит. На 5.2.5 этот путь
    // кода отсутствует, поэтому minSdk 24 снова собирается без ошибок D8.
    implementation('org.apache.poi:poi:5.2.5') { exclude group: 'org.apache.commons', module: 'commons-compress' }
    implementation('org.apache.poi:poi-ooxml:5.2.5') { exclude group: 'org.apache.commons', module: 'commons-compress' }
    implementation 'org.apache.commons:commons-compress:1.26.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}