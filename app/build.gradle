plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.university.schedule'
    compileSdk 36
    defaultConfig {
        applicationId "com.university.schedule"
        // minSdk 26 (Android 8.0): транзитивный log4j-api от Apache POI
        // (org.apache.logging.log4j.util.ServiceLoaderUtil) использует
        // MethodHandle.invoke/invokeExact (invoke-polymorphic) — D8 дексит
        // это только при --min-api 26+, desugaring не помогает.
        minSdkVersion 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt','META-INF/*.kotlin_module','META-INF/INDEX.LIST']
        }
    }
}
// АЛЬТЕРНАТИВА, если понадобится вернуть minSdk 24: раскомментируйте блок
// ниже — log4j-api 2.17.2 ещё не содержит invoke-polymorphic в
// ServiceLoaderUtil, и POI 5.2.5 с ним работает (базовый log4j-API совместим).
// configurations.all {
//     resolutionStrategy.force 'org.apache.logging.log4j:log4j-api:2.17.2'
// }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation('org.apache.poi:poi:5.2.5') { exclude group: 'org.apache.commons', module: 'commons-compress' }
    implementation('org.apache.poi:poi-ooxml:5.2.5') { exclude group: 'org.apache.commons', module: 'commons-compress' }
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}